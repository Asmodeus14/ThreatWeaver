# ThreatWeaver Model Architecture & Training Parameters
model:
  schema_version: "1.0"
  input_dim: 256
  hidden_dims: [256, 128, 64]
  embedding_dim: 32
  num_classes: 2
  dropout: 0.2
  use_layer_norm: true
  activation: "gelu"

# Novelty Detection Settings
novelty:
  distance_metric: "cosine"  # "cosine" or "euclidean"
  percentile_threshold: 95.0 # Calibrated on validation data
  prototype_k: 5             # Number of cluster prototypes

# Training Settings
training:
  epochs_per_batch: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 64
  device: "auto"             # "cuda", "cpu", or "auto"
  checkpoint_dir: "artifacts/checkpoints"
