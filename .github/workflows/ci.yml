name: CI

on:
  push:
    branches: [master, "roadmap/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,ember,rules,desktop]"
      - name: Test
        # Tests that need the local EMBER2024 data (data/ is not in git) skip themselves.
        run: pytest -q
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true  # report only until the baseline is triaged

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed build is up to date
        working-directory: .
        run: git diff --exit-code -- src/threatweaver/app/static
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
