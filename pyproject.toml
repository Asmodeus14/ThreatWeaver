[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threatweaver"
version = "0.1.0"
description = "AI-Powered Malware Research Engine & Next-Generation Antivirus Prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Abhay Singh", email = "singhabhay3145@gmail.com"}
]
# Compatible ranges; the exact verified environment is in requirements.lock.txt
dependencies = [
    "torch>=2.2,<3",
    "pefile>=2023.2.7",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "pyyaml>=6.0,<7",
    "rich>=13.0,<16",
    "matplotlib>=3.7,<4",
    "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=4.0",
]
desktop = [
    "pywebview>=5.0,<7",
]
build = [
    "pyinstaller>=6.0,<7",
]

[project.scripts]
threatweaver = "threatweaver.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threatweaver = ["models/trusted_keys/*.pub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
